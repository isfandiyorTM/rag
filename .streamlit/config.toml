[theme]
base            = "dark"
primaryColor    = "#6378de"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1d27"
textColor       = "#e0e4f0"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

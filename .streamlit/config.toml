[theme]
base                     = "dark"
primaryColor             = "#7c5cfc"
backgroundColor          = "#0f172a"
secondaryBackgroundColor = "#0c1322"
textColor                = "#e2e8f0"
font                     = "sans serif"

[server]
headless             = true
enableCORS           = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
